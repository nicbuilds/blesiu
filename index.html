<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cotizador BLESIÚ</title>
    <!-- html2pdf bundle CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --rosa-pastel: #edc2bd;
            --cafe-suave: #48372e;
            --cafe-claro: #7b5d49;
            --fondo: #fbf6f3;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--fondo);
            color: var(--cafe-suave);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--blanco);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--rosa-pastel);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Times New Roman', serif;
            font-size: 36px;
            margin: 0;
            color: var(--cafe-suave);
        }

        .subtitle {
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--cafe-claro);
            margin-top: 5px;
        }

        .form-section {
            margin-bottom: 20px;
        }

        .form-section h3 {
            border-bottom: 1px solid var(--rosa-pastel);
            padding-bottom: 5px;
            color: var(--cafe-claro);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 5px;
        }

        input[type="text"], input[type="date"], input[type="number"], select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .checkbox-group input {
            width: auto;
        }

        .total-box {
            background-color: var(--fondo);
            padding: 20px;
            border-left: 5px solid var(--rosa-pastel);
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
        }

        .actions {
            margin-top: 25px;
            display: flex;
            gap: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-calc {
            background-color: var(--cafe-suave);
            color: var(--blanco);
        }

        .btn-calc:hover {
            background-color: var(--cafe-claro);
        }

        .btn-pdf {
            background-color: var(--rosa-pastel);
            color: var(--cafe-suave);
        }

        .btn-pdf:hover {
            background-color: #e2b2ac;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>BLESIÚ</h1>
        <div class="subtitle">Pequeños placeres para grandes momentos • Estd. 2012</div>
    </header>

    <div class="form-section">
        <h3>Datos del Cliente</h3>
        <div class="grid">
            <div>
                <label for="nombreCliente">Nombre del Cliente</label>
                <input type="text" id="nombreCliente" placeholder="Ej. Maria Lopez">
            </div>
            <div>
                <label for="fechaEvento">Fecha del Evento</label>
                <input type="date" id="fechaEvento">
            </div>
            <div>
                <label for="lugarEvento">Lugar / Ubicación</label>
                <input type="text" id="lugarEvento" placeholder="Ej. Jardín del Sol">
            </div>
        </div>
    </div>

    <div class="form-section">
        <h3>Productos y Servicios</h3>
        <div class="grid">
            <div>
                <label for="numPostres">Postres Individuales (Piezas)</label>
                <input type="number" id="numPostres" value="0" min="0">
            </div>
            <div>
                <label for="numChilitos">Chilitos y Salados (Piezas)</label>
                <input type="number" id="numChilitos" value="0" min="0">
            </div>
            <div>
                <label for="numEsquites">Barra Esquites/Maruchan (Unidades)</label>
                <input type="number" id="numEsquites" value="0" min="0">
            </div>
        </div>

        <div class="grid" style="margin-top: 15px;">
            <div>
                <label for="utileria">Pastel de Utilería</label>
                <select id="utileria">
                    <option value="0">Ninguno</option>
                    <option value="500">Sencillo ($500)</option>
                    <option value="900">Especial ($900)</option>
                </select>
            </div>
            <div>
                <label for="comestible">Pastel Comestible</label>
                <select id="comestible">
                    <option value="0">Ninguno</option>
                    <option value="800">1 Piso - 15 personas ($800)</option>
                    <option value="1500">2 Pisos - 30 personas ($1,500)</option>
                    <option value="2200">3 Pisos - 50 personas ($2,200)</option>
                </select>
                <div class="checkbox-group">
                    <input type="checkbox" id="saborEspecial">
                    <label for="saborEspecial" style="font-weight: normal;">Sabor Especial (+ $150)</label>
                </div>
            </div>
            <div>
                <label for="bases">Renta de Bases</label>
                <select id="bases">
                    <option value="0">Sin Renta</option>
                    <option value="300">Set Básico ($300)</option>
                    <option value="600">Set Premium ($600)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="form-section">
        <h3>Montaje y Logística</h3>
        <div class="grid">
            <div>
                <label for="montaje">Servicio de Montaje</label>
                <select id="montaje">
                    <option value="0">Sin Montaje</option>
                    <option value="400">Montaje Básico ($400)</option>
                    <option value="800">Montaje Completo Decorado ($800)</option>
                </select>
            </div>
            <div>
                <label for="distancia">Distancia Traslado (KM)</label>
                <input type="number" id="distancia" value="0" min="0">
            </div>
            <div>
                <label for="tipoZona">Tipo de Zona</label>
                <select id="tipoZona">
                    <option value="urbana">Urbana</option>
                    <option value="foranea">Foránea (+ $200)</option>
                </select>
                <div class="checkbox-group">
                    <input type="checkbox" id="tempAlta">
                    <label for="tempAlta" style="font-weight: normal;">Alta Temp / Refrigerado (+ $100)</label>
                </div>
            </div>
        </div>
    </div>

    <div class="total-box">
        <span>ESTIMADO TOTAL:</span>
        <span id="totalDisplay">$0.00 MXN</span>
    </div>

    <div class="actions">
        <button class="btn-calc" onclick="actualizarTotalUI()">Calcular Cotización</button>
        <button class="btn-pdf" onclick="descargarPDF()">Descargar PDF</button>
    </div>
</div>

<script>
    // Precios Unitarios
    const PRECIO_POSTRE = 25;
    const PRECIO_CHILITO = 20;
    const PRECIO_ESQUITE = 35;
    const COSTO_POR_KM = 15;

    function calcularCotizacion() {
        let numPostres = parseInt(document.getElementById('numPostres').value) || 0;
        let numChilitos = parseInt(document.getElementById('numChilitos').value) || 0;
        let numEsquites = parseInt(document.getElementById('numEsquites').value) || 0;

        let costoPostres = numPostres * PRECIO_POSTRE;
        let costoChilitos = numChilitos * PRECIO_CHILITO;
        let costoEsquites = numEsquites * PRECIO_ESQUITE;

        let costoUtileria = parseFloat(document.getElementById('utileria').value) || 0;
        
        let costoComestible = parseFloat(document.getElementById('comestible').value) || 0;
        if (costoComestible > 0 && document.getElementById('saborEspecial').checked) {
            costoComestible += 150;
        }

        let costoBases = parseFloat(document.getElementById('bases').value) || 0;
        let costoMontaje = parseFloat(document.getElementById('montaje').value) || 0;

        let km = parseFloat(document.getElementById('distancia').value) || 0;
        let costoFlete = km * COSTO_POR_KM;
        if (document.getElementById('tipoZona').value === 'foranea') {
            costoFlete += 200;
        }
        if (document.getElementById('tempAlta').checked) {
            costoFlete += 100;
        }

        let total = costoPostres + costoChilitos + costoEsquites + costoUtileria + 
                    costoComestible + costoBases + costoMontaje + costoFlete;

        return {
            numPostres, costoPostres,
            numChilitos, costoChilitos,
            numEsquites, costoEsquites,
            costoUtileria,
            costoComestible,
            costoBases,
            costoMontaje,
            costoFlete,
            total
        };
    }

    function actualizarTotalUI() {
        let data = calcularCotizacion();
        document.getElementById('totalDisplay').innerText = `$${data.total.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN`;
    }

    function descargarPDF() {
        let cliente = document.getElementById('nombreCliente').value || 'Cliente';
        let fecha = document.getElementById('fechaEvento').value || 'Por definir';
        let lugar = document.getElementById('lugarEvento').value || 'Por definir';

        let utileriaText = document.getElementById('utileria').options[document.getElementById('utileria').selectedIndex].text;
        let comestibleText = document.getElementById('comestible').options[document.getElementById('comestible').selectedIndex].text;
        let basesText = document.getElementById('bases').options[document.getElementById('bases').selectedIndex].text;
        let montajeText = document.getElementById('montaje').options[document.getElementById('montaje').selectedIndex].text;
        
        let data = calcularCotizacion();

        // 1. Crear contenedor temporal
        let pdfContainer = document.createElement('div');
        
        // Asignar estilos explícitos de renderizado
        pdfContainer.style.width = '750px';
        pdfContainer.style.padding = '40px';
        pdfContainer.style.fontFamily = "'Helvetica Neue', Helvetica, Arial, sans-serif";
        pdfContainer.style.color = '#48372e';
        pdfContainer.style.backgroundColor = '#ffffff';
        pdfContainer.style.position = 'fixed';
        pdfContainer.style.left = '-9999px';
        pdfContainer.style.top = '0';
        pdfContainer.style.zIndex = '-1000';

        pdfContainer.innerHTML = `
            <div style="text-align: center; border-bottom: 2px solid #edc2bd; padding-bottom: 20px; margin-bottom: 30px;">
                <h1 style="font-family: 'Times New Roman', serif; font-size: 32px; margin: 0; color: #48372e;">BLESIÚ</h1>
                <p style="font-size: 12px; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; color: #7b5d49;">Pequeños placeres para grandes momentos • Estd. 2012</p>
            </div>

            <h2 style="font-size: 20px; text-align: center; margin-bottom: 25px; color: #48372e;">RESUMEN DE COTIZACIÓN</h2>

            <table style="width: 100%; margin-bottom: 30px; border-collapse: collapse; font-size: 14px;">
                <tr>
                    <td style="padding: 6px 0; font-weight: bold; width: 140px;">Cliente:</td>
                    <td style="padding: 6px 0;">${cliente}</td>
                </tr>
                <tr>
                    <td style="padding: 6px 0; font-weight: bold;">Fecha Evento:</td>
                    <td style="padding: 6px 0;">${fecha}</td>
                </tr>
                <tr>
                    <td style="padding: 6px 0; font-weight: bold;">Lugar / Ubicación:</td>
                    <td style="padding: 6px 0;">${lugar}</td>
                </tr>
            </table>

            <table style="width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 30px;">
                <thead>
                    <tr style="background-color: #fbf6f3; border-bottom: 1px solid #edc2bd;">
                        <th style="padding: 10px; text-align: left; color: #48372e;">Concepto</th>
                        <th style="padding: 10px; text-align: right; color: #48372e;">Importe</th>
                    </tr>
                </thead>
                <tbody>
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;">Postres individuales (${data.numPostres} piezas)</td>
                        <td style="padding: 10px; text-align: right;">$${data.costoPostres.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;">Chilitos y Salados (${data.numChilitos} piezas)</td>
                        <td style="padding: 10px; text-align: right;">$${data.costoChilitos.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;">Barra de Esquites / Maruchan / Tostilocos (${data.numEsquites} unidades)</td>
                        <td style="padding: 10px; text-align: right;">$${data.costoEsquites.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;">Pastel de Utilería: ${utileriaText}</td>
                        <td style="padding: 10px; text-align: right;">$${data.costoUtileria.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;">Pastel Comestible: ${comestibleText} ${document.getElementById('saborEspecial').checked ? '(Con Sabor Especial)' : ''}</td>
                        <td style="padding: 10px; text-align: right;">$${data.costoComestible.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;">Renta de Bases: ${basesText}</td>
                        <td style="padding: 10px; text-align: right;">$${data.costoBases.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;">Servicio de Montaje: ${montajeText}</td>
                        <td style="padding: 10px; text-align: right;">$${data.costoMontaje.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;">Flete y Traslado (${document.getElementById('distancia').value || 0} km - ${document.getElementById('tipoZona').value}) ${document.getElementById('tempAlta').checked ? '(Alta temp.)' : ''}</td>
                        <td style="padding: 10px; text-align: right;">$${data.costoFlete.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN</td>
                    </tr>
                </tbody>
            </table>

            <div style="background-color: #fbf6f3; padding: 15px; border-left: 4px solid #edc2bd; display: flex; justify-content: space-between; font-size: 18px; font-weight: bold;">
                <span>ESTIMADO TOTAL:</span>
                <span>$${data.total.toLocaleString('es-MX', {minimumFractionDigits: 2})} MXN</span>
            </div>

            <div style="margin-top: 50px; text-align: center; font-size: 11px; color: #7b5d49; border-top: 1px dashed #edc2bd; padding-top: 15px;">
                Este documento es una estimación de presupuesto generada en línea. Sujeta a confirmación de disponibilidad.
            </div>
        `;

        // 2. Insertar obligatoriamente al body para renderizado
        document.body.appendChild(pdfContainer);

        let opt = {
            margin:       0.4,
            filename:     `Cotizacion_Blesiu_${cliente.replace(/\s+/g, '_')}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, scrollY: 0, scrollX: 0 },
            jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        // 3. Generar y remover nodo al terminar
        html2pdf().set(opt).from(pdfContainer).save().then(() => {
            document.body.removeChild(pdfContainer);
        }).catch(err => {
            console.error('Error al generar PDF:', err);
            if (document.body.contains(pdfContainer)) {
                document.body.removeChild(pdfContainer);
            }
        });
    }
</script>

</body>
</html>
